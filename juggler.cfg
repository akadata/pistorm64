cpu 68000
platform amiga 500

# Minimal A500 profile for old floppy demos (no PiSCSI/RTG/Zorro extras).
# Disable PiStorm interaction AutoConfig device for cleaner floppy-only boots.
setvar no-pistorm-dev

# Load PiSCSI device only (no unit mappings in this profile).
setvar piscsi

# Minimal Z2 Fast RAM for PiSCSI boot path.
map type=ram address=0x200000 size=2M id=z2_autoconf_fast

# Force-map a known A500-compatible ROM (avoid onboard fallback ambiguity).
# This file exists in your tree: ../Amiga/kick/kick.a500.46.143
map type=rom address=0xF80000 size=0x80000 file=../Amiga/kick/kick.a500.46.143 ovl=0 id=kickstart
