# PiStorm64 – Stable Module Baseline
#
# This configuration reflects the currently validated stability island
# for the CPLD/RTL + kernel module handshake.
#
# Clocking:
#   gpclk_src=5 (PLL parent ≈ 648 MHz)
#   gpclk_div=6 → ~108 MHz
#
# Observed behaviour:
#   - div=6: stable under sustained audio DMA, RTG load, and long renders
#   - div=4 (~162 MHz): txn deadlock (PIN_TXN_IN_PROGRESS stuck)
#   - div=7 (~92 MHz): handshake instability under load
#
# Arbitration:
#   bus_arb_release=1 enables BR/BG-aware relinquish and correct DMA timing.
#
# Safety:
#   berr_reset_input=1 allows recovery from bus error conditions.
#   run_batch_enable=1 maintains validated transaction cadence.
#
# This baseline prioritizes deterministic behaviour over peak clock speed.
#
options pistorm gpclk_src=5 gpclk_div=6 run_batch_enable=1 berr_reset_input=1 bus_arb_release=1
