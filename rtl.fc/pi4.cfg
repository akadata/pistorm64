# PiStorm EPM240 programming (Pi 4, bcm2835gpio) - known working settings

reset_config none
adapter driver bcm2835gpio

bcm2835gpio_peripheral_base 0xFE000000

# Transition delay calculation: SPEED_COEFF/khz - SPEED_OFFSET
# These depend on system clock; calibrated for Pi4
bcm2835gpio_speed_coeffs 270000 60

reset_config none
adapter speed 100

# JTAG                tck tms tdi tdo
bcm2835gpio_jtag_nums 26 24   27  25

# meh dummy reset to make openocd happy, set to A0 on SMI
bcm2835gpio_srst_num 5
reset_config srst_only srst_open_drain

transport select jtag
jtag newtap max2 tap -irlen 11 -expected-id 0x020a10dd
init
svf ./pistorm_fc.svf -progress
sleep 200
shutdown
